serial --unit=0 --speed=115200
terminal_input serial console
terminal_output serial console

set timeout=0
set default=0

menuentry "MyOS 0.1.0 (x86_64)" {
    insmod vbe
    insmod vga
    insmod video_bochs
    insmod video_cirrus
    set gfxpayload=1024x768x32
    multiboot /boot/myos.bin
    boot
}
