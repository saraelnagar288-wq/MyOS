name: Release MyOS Update

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Stable version, e.g. 0.2.0 (preview only unless run on a version tag)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate requested version
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
        run: |
          python3 - <<'PY'
          import os, re, sys
          version = os.environ.get("VERSION", "")
          if not re.fullmatch(r"v?(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)", version):
              sys.exit("Version must be a stable semantic version such as 0.2.0 or v0.2.0")
          if os.environ.get("GITHUB_REF_TYPE") == "tag" and version != os.environ.get("GITHUB_REF_NAME"):
              sys.exit("Release tag and version do not match")
          print(f"Validated version: {version}")
          PY

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm grub-pc-bin grub-efi-amd64-bin grub-common xorriso mtools gcc binutils make

      - name: Build bootable image
        working-directory: MyOS/core
        run: |
          chmod +x build.sh
          ./build.sh
          test -s MyOS.iso
          sha256sum MyOS.iso > MyOS.iso.sha256

      - name: Prepare release assets
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          mkdir -p dist
          cp MyOS/core/MyOS.iso dist/MyOS.iso
          cp MyOS/core/MyOS.iso.sha256 dist/MyOS.iso.sha256
          python3 update-server/manifest.py create \
            --image dist/MyOS.iso \
            --checksum dist/MyOS.iso.sha256 \
            --version "$VERSION" \
            --repository "$REPOSITORY" \
            --server-url "$SERVER_URL" \
            --output dist/latest.json

      - name: Independently validate release assets
        run: |
          python3 update-server/manifest.py validate \
            --manifest dist/latest.json \
            --image dist/MyOS.iso \
            --checksum dist/MyOS.iso.sha256
          python3 -m json.tool dist/latest.json >/dev/null
          test -s dist/MyOS.iso
          test -s dist/MyOS.iso.sha256
          test -s dist/latest.json

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/MyOS.iso dist/MyOS.iso.sha256 dist/latest.json \
            --repo "${GITHUB_REPOSITORY}" \
            --title "MyOS ${GITHUB_REF_NAME}" \
            --generate-notes

      - name: Upload artifacts for manual workflow runs
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: MyOS-update-preview
          path: dist/*
          if-no-files-found: error
