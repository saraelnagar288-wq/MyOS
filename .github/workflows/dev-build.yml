name: MyOS Development ISO

on:
  push:
    branches:
      - "feat/**"
      - "main"
  pull_request:
    branches:
      - "main"
      - "feat/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: myos-dev-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-iso:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MyOS source
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm grub-pc-bin grub-efi-amd64-bin grub-common xorriso mtools gcc binutils make

      - name: Build bootable ISO
        working-directory: MyOS/core
        run: |
          chmod +x build.sh
          ./build.sh
          test -s MyOS.iso
          file MyOS.iso
          sha256sum MyOS.iso | tee MyOS.iso.sha256

      - name: Upload ISO for Hyper-V testing
        uses: actions/upload-artifact@v4
        with:
          name: MyOS-ISO-${{ github.sha }}
          path: |
            MyOS/core/MyOS.iso
            MyOS/core/MyOS.iso.sha256
          if-no-files-found: error
          retention-days: 14
