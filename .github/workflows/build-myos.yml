name: Build MyOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install OS toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm grub-pc-bin grub-efi-amd64-bin grub-common xorriso mtools qemu-system-x86 ovmf gcc binutils make

      - name: Build bootable ISO
        working-directory: MyOS/core
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Validate ISO
        working-directory: MyOS/core
        run: |
          file MyOS.iso
          test -s MyOS.iso
          xorriso -indev MyOS.iso -report_el_torito plain
          sha256sum MyOS.iso | tee MyOS.iso.sha256

      - name: BIOS boot smoke test
        working-directory: MyOS/core
        run: |
          set +e
          timeout 8s qemu-system-x86_64 -cdrom MyOS.iso -m 256M -vga std -serial stdio -display none
          status=$?
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            echo "QEMU BIOS smoke test failed with exit code $status"
            exit "$status"
          fi

      - name: UEFI boot smoke test
        working-directory: MyOS/core
        run: |
          set +e
          OVMF_CODE="$(find /usr/share/OVMF -maxdepth 1 -type f -name 'OVMF_CODE*.fd' 2>/dev/null | head -n 1)"
          if [ -z "$OVMF_CODE" ]; then
            echo "No compatible OVMF_CODE firmware file was found under /usr/share/OVMF"
            ls -la /usr/share/OVMF || true
            exit 1
          fi
          timeout 8s qemu-system-x86_64 -cdrom MyOS.iso -m 256M -vga std -serial stdio -display none -bios "$OVMF_CODE"
          status=$?
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            echo "QEMU UEFI smoke test failed with exit code $status"
            exit "$status"
          fi

      - name: Upload MyOS USB image
        uses: actions/upload-artifact@v4
        with:
          name: MyOS-USB-ISO
          path: |
            MyOS/core/MyOS.iso
            MyOS/core/MyOS.iso.sha256
          if-no-files-found: error
