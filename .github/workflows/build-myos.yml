name: Build MyOS

on:
  push:
    branches: [main, "work/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install OS toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm grub-pc-bin grub-efi-amd64-bin grub-common xorriso mtools qemu-system-x86 ovmf gcc binutils make

      - name: Test memory allocator bounds and alignment
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -I MyOS/core MyOS/core/memory.c MyOS/core/tests/memory_test.c -o /tmp/myos-memory-test
          /tmp/myos-memory-test

      - name: Build bootable ISO
        working-directory: MyOS/core
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Validate ISO and calculate checksum
        working-directory: MyOS/core
        run: |
          file MyOS.iso
          test -s MyOS.iso
          xorriso -indev MyOS.iso -report_el_torito plain
          sha256sum MyOS.iso | tee MyOS.iso.sha256
          test -s MyOS.iso.sha256

      - name: BIOS boot smoke test
        working-directory: MyOS/core
        shell: bash
        run: |
          set +e
          timeout 8s qemu-system-x86_64 -cdrom MyOS.iso -m 256M -vga std -serial stdio -display none 2>&1 | tee /tmp/myos-bios.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            echo "QEMU BIOS smoke test failed with exit code $status"
            exit "$status"
          fi
          if ! grep -q "MyOS: kernel start" /tmp/myos-bios.log; then
            echo "BIOS smoke test did not reach kernel_main"
            exit 1
          fi

      - name: UEFI boot smoke test
        working-directory: MyOS/core
        shell: bash
        run: |
          OVMF_CODE="$(find /usr/share/OVMF -maxdepth 1 -type f -name 'OVMF_CODE*.fd' ! -name '*secboot*' ! -name '*snakeoil*' 2>/dev/null | sort | head -n 1)"
          if [ -z "$OVMF_CODE" ]; then
            echo "No compatible OVMF_CODE firmware file was found under /usr/share/OVMF"
            ls -la /usr/share/OVMF || true
            exit 1
          fi
          set +e
          timeout 8s qemu-system-x86_64 -cdrom MyOS.iso -m 256M -vga std -serial stdio -display none -drive if=pflash,format=raw,unit=0,file="$OVMF_CODE",readonly=on 2>&1 | tee /tmp/myos-uefi.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            echo "QEMU UEFI smoke test failed with exit code $status"
            exit "$status"
          fi
          if ! grep -q "MyOS: kernel start" /tmp/myos-uefi.log; then
            echo "UEFI smoke test did not reach kernel_main"
            exit 1
          fi

      - name: Upload MyOS USB image
        uses: actions/upload-artifact@v4
        with:
          name: MyOS-USB-ISO
          path: |
            MyOS/core/MyOS.iso
            MyOS/core/MyOS.iso.sha256
          if-no-files-found: error
